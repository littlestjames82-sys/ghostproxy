[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostproxy"
version = "0.1.0"
description = "Local, fail-open, in-flight context proxy that applies GhostSlice automatically (Anthropic Messages shape, localhost only)"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ghost Developer Studio" }]
keywords = ["llm", "proxy", "context", "ghostslice", "claude-code"]
dependencies = []

[project.scripts]
ghostproxy = "ghostproxy.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
